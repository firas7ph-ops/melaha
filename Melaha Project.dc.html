    }
    if (p.tiktok || (p.tiktoks && p.tiktoks.length)) {
      const ids = p.tiktoks || [p.tiktok];
      const g = document.createElement('div');
      g.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(12px,1.6vw,20px)';
      ids.forEach(id => {
        const w = document.createElement('div');
        w.style.cssText = 'position:relative;width:100%;aspect-ratio:9/14;border-radius:20px;overflow:hidden;border:1px solid rgba(242,237,228,.14);background:#0C1E2C';
        w.innerHTML = '<iframe src="https://www.tiktok.com/embed/v2/' + id + '?lang=ar" title="' + p.title + '" allow="encrypted-media;fullscreen;picture-in-picture" allowfullscreen="" style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>';
        g.appendChild(w);
      });
      media.appendChild(g);
    }

    const kw = q('[data-kpis]');
    kw.innerHTML = '';
    kw.style.gridTemplateColumns = 'repeat(auto-fit,minmax(200px,1fr))';
    kw.parentElement.style.display = (p.kpis.length || p.hero) ? '' : 'none';
    if (p.hero) {
      const d = document.createElement('div');
      d.setAttribute('data-reveal', '');
      d.style.cssText = 'grid-column:1/-1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(14px,2vw,26px);padding:clamp(40px,6vw,90px) clamp(22px,3vw,40px);border:1px solid rgba(242,237,228,.14);border-radius:24px;background:rgba(242,237,228,.03)';
      d.innerHTML = '<div style="font-family:var(--head);font-weight:900;font-size:clamp(80px,16vw,240px);line-height:.85;color:#93B8CE">' + p.hero.v + '</div>' +
        '<div style="max-width:34ch;font-size:clamp(15px,1.35vw,20px);line-height:1.75;color:rgba(242,237,228,.72)">' + p.hero.l + '</div>';
      kw.appendChild(d);
    }
    p.kpis.forEach(k => {
      const d = document.createElement('div');
      d.setAttribute('data-reveal', '');
      d.style.cssText = 'padding:clamp(22px,2.4vw,32px);border:1px solid rgba(242,237,228,.14);border-radius:18px;background:rgba(242,237,228,.03)';
      d.innerHTML = '<div style="font-family:var(--head);font-weight:900;font-size:clamp(30px,3.4vw,52px);line-height:1;color:#93B8CE">' + k.v + '</div>' +
        '<div style="font-size:14px;color:rgba(242,237,228,.6);margin-top:12px;line-height:1.6">' + k.l + '</div>';
      kw.appendChild(d);
    });

    const bw = q('[data-blocks]');
    bw.innerHTML = '';
    p.blocks.forEach(b => {
      const row = document.createElement('div');
      row.setAttribute('data-reveal', '');
      row.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(20px,3vw,60px);padding:clamp(28px,3.6vw,50px) 0;border-top:1px solid rgba(242,237,228,.14)';
      const head = '<div><div style="font-family:var(--head);font-weight:900;font-size:clamp(28px,3vw,44px);line-height:1;color:rgba(147,184,206,.85);margin-bottom:14px">' + b.n + '</div>' +
        '<h3 style="font-size:clamp(21px,2.2vw,32px);font-weight:700;line-height:1.25">' + b.t + '</h3></div>';
      const paras = b.p.map(t => '<p style="font-size:clamp(15px,1.15vw,17px);line-height:1.85;color:rgba(242,237,228,.72);margin:0">' + t + '</p>').join('');
      const bullets = b.b.length ? '<ul style="display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none">' +
        b.b.map(t => '<li style="display:flex;gap:12px;font-size:15px;line-height:1.7;color:rgba(242,237,228,.66)"><span style="color:#93B8CE;flex:none">—</span><span>' + t + '</span></li>').join('') + '</ul>' : '';
      row.innerHTML = head + '<div style="display:flex;flex-direction:column;gap:18px;max-width:62ch">' + paras + bullets + '</div>';
      bw.appendChild(row);
    });

    const nx = q('[data-next]');
    nx.innerHTML = '';
    (p.next || []).forEach(k => {
      const o = DATA[k];
      if (!o) return;
      const a = document.createElement('a');
      a.href = '#' + k;
      a.setAttribute('data-magnet', '');
      a.style.cssText = 'position:relative;display:flex;gap:18px;align-items:center;padding:16px;border:1px solid rgba(242,237,228,.14);border-radius:18px;background:rgba(242,237,228,.03);transition:transform .5s ' + EASE + ',border-color .5s';
      const thumb = o.cover
        ? '<img src="' + o.cover + '" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover" />'
        : '<span style="display:block;width:100%;height:100%;background:repeating-linear-gradient(135deg,rgba(242,237,228,.06) 0 12px,rgba(242,237,228,.02) 12px 24px)"></span>';
      a.innerHTML = '<div style="width:96px;height:72px;border-radius:12px;overflow:hidden;flex:none;background:#1A2A38">' + thumb + '</div>' +
        '<div><div style="font-size:12px;color:rgba(242,237,228,.5);margin-bottom:6px">' + o.client + ' · ' + o.year + '</div>' +
        '<div style="font-family:var(--head);font-weight:700;font-size:clamp(17px,1.7vw,24px);line-height:1.25">' + o.title.replace('.', '') + '</div></div>' +
        '<div style="margin-inline-start:auto;color:#93B8CE;font-size:20px;padding-inline:8px">↗</div>';
      a.addEventListener('mouseenter', () => { a.style.transform = 'translateY(-4px)'; a.style.borderColor = 'rgba(147,184,206,.5)'; });
      a.addEventListener('mouseleave', () => { a.style.transform = 'none'; a.style.borderColor = 'rgba(242,237,228,.14)'; });
      nx.appendChild(a);
    });

    this.motion();
  }

  motion() {
    const EASE = 'cubic-bezier(.16,1,.3,1)';
    const h1 = document.querySelector('[data-title]');
    if (h1) {
      const words = (h1.textContent || '').trim().split(/\s+/);
      h1.textContent = '';
      words.forEach((w, i) => {
        const mask = document.createElement('span');
        mask.style.cssText = 'display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em';
        const inner = document.createElement('span');
        inner.textContent = w;
        inner.style.cssText = 'display:inline-block;transform:translateY(108%);transition:transform 1s ' + EASE + ' ' + (i * 70) + 'ms';
        mask.appendChild(inner);
        h1.appendChild(mask);
        if (i < words.length - 1) h1.appendChild(document.createTextNode(' '));
      });
      setTimeout(() => h1.querySelectorAll('span > span').forEach(s => { s.style.transform = 'translateY(0)'; }), 120);
    }

    document.querySelectorAll('[data-reveal]').forEach(el => {
      if (el.dataset.shown) return;
      el.style.opacity = '0';
      el.style.transform = 'translateY(24px)';
      el.style.transition = 'opacity .9s ' + EASE + ',transform .9s ' + EASE;
    });
    const show = el => { el.dataset.shown = '1'; el.style.opacity = '1'; el.style.transform = 'none'; };
    if (this._io) this._io.disconnect();
    this._io = new IntersectionObserver(es => {
      es.forEach(e => { if (e.isIntersecting) { show(e.target); this._io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    document.querySelectorAll('[data-reveal]').forEach(el => this._io.observe(el));
    setTimeout(() => document.querySelectorAll('[data-reveal]').forEach(show), 3200);

    const cur = document.querySelector('[data-cursor]');
    if (!this._cursorIv) {
      let cx = 0, cy = 0, tx = 0, ty = 0;
      this._move = e => { tx = e.clientX; ty = e.clientY; if (cur) cur.style.opacity = '1'; };
      window.addEventListener('mousemove', this._move, { passive: true });
      this._cursorIv = setInterval(() => {
        cx += (tx - cx) * 0.2; cy += (ty - cy) * 0.2;
        if (cur) cur.style.transform = 'translate(' + cx.toFixed(1) + 'px,' + cy.toFixed(1) + 'px) translate(-50%,-50%)';
      }, 16);
    }
    document.querySelectorAll('[data-magnet]').forEach(el => {
      if (el.dataset.mag) return;
      el.dataset.mag = '1';
      el.addEventListener('mouseenter', () => { if (cur) { cur.style.width = '46px'; cur.style.height = '46px'; cur.style.background = 'rgba(147,184,206,.18)'; } });
      el.addEventListener('mouseleave', () => { if (cur) { cur.style.width = '12px'; cur.style.height = '12px'; cur.style.background = 'rgba(147,184,206,.35)'; } });
    });

    if (!this._onScroll) {
      const nav = document.querySelector('[data-nav]');
      const bar = document.querySelector('[data-progress]');
      let lastY = window.scrollY;
      this._onScroll = () => {
        const y = window.scrollY;
        const max = document.documentElement.scrollHeight - window.innerHeight;
        if (bar) bar.style.width = (max > 0 ? (y / max) * 100 : 0) + '%';
        document.querySelectorAll('[data-parallax]').forEach(el => {
          const r = el.getBoundingClientRect();
          if (r.bottom > -200 && r.top < window.innerHeight + 200) {
            const rel = r.top + r.height / 2 - window.innerHeight / 2;
            el.style.transform = 'translate3d(0,' + (rel * parseFloat(el.dataset.parallax)).toFixed(2) + 'px,0)';
          }
        });
        if (nav) {
          if (y > lastY + 4 && y > 220) nav.style.transform = 'translateY(-110%)';
          if (y < lastY - 4) nav.style.transform = 'translateY(0)';
          if (y > 80) {
            nav.style.background = 'rgba(10,21,32,.72)';
            nav.style.backdropFilter = 'blur(14px)';
            nav.style.padding = '14px clamp(20px,4vw,56px)';
          } else {
            nav.style.background = 'transparent';
            nav.style.backdropFilter = 'none';
            nav.style.padding = '22px clamp(20px,4vw,56px)';
          }
          if (Math.abs(y - lastY) > 4) lastY = y;
        }
      };
      window.addEventListener('scroll', this._onScroll, { passive: true });
      window.addEventListener('resize', this._onScroll);
      this._onScroll();
    }
  }

  componentWillUnmount() {
    clearInterval(this._cursorIv);
    if (this._io) this._io.disconnect();
    window.removeEventListener('hashchange', this._hash);
    window.removeEventListener('scroll', this._onScroll);
    window.removeEventListener('resize', this._onScroll);
    window.removeEventListener('mousemove', this._move);
  }

  renderVals() { return {}; }
}

</script>
</body>
</html>
