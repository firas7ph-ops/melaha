    s.deliverables.forEach(([t, d], i) => {
      const c = document.createElement('div');
      c.setAttribute('data-reveal', '');
      c.style.cssText = 'display:flex;flex-direction:column;gap:12px;padding:clamp(24px,2.6vw,36px);border-radius:22px;background:rgba(10,21,32,.05);border:1px solid rgba(10,21,32,.09);transition:background .5s,transform .5s ' + EASE;
      c.innerHTML = '<div style="font-family:var(--head);font-weight:700;font-size:13px;opacity:.45">' + AR[i] + '</div>' +
        '<h3 style="font-size:clamp(19px,1.8vw,26px);font-weight:700;line-height:1.3">' + t + '</h3>' +
        '<p style="font-size:15px;line-height:1.7;opacity:.68;margin:0">' + d + '</p>';
      c.addEventListener('mouseenter', () => { c.style.background = 'rgba(10,21,32,.09)'; c.style.transform = 'translateY(-5px)'; });
      c.addEventListener('mouseleave', () => { c.style.background = 'rgba(10,21,32,.05)'; c.style.transform = 'none'; });
      inc.appendChild(c);
    });

    const AN = ['١','٢','٣','٤','٥','٦','٧','٨','٩','١٠','١١','١٢'];
    const g = q('[data-gantt]');
    g.innerHTML = '';
    const n = s.phases.length;
    const wide = window.innerWidth >= 900;
    if (wide) {
      const AXIS = 4;
      const rows = document.createElement('div');
      rows.style.cssText = 'position:relative;display:flex;flex-direction:column;gap:10px;padding:clamp(18px,2.4vw,30px) 0';
      const grid = document.createElement('div');
      grid.style.cssText = 'position:absolute;inset:0;display:grid;grid-template-columns:repeat(' + AXIS + ',1fr);pointer-events:none';
      for (let k = 0; k < AXIS; k++) {
        const col = document.createElement('div');
        col.style.cssText = 'border-inline-start:1px dashed rgba(10,21,32,.22)';
        grid.appendChild(col);
      }
      rows.appendChild(grid);
      s.phases.forEach(([t, ap], i) => {
        const span = 100 / (n + 2) * 3;
        const start = (100 - span) * (i / Math.max(1, n - 1));
        const r = document.createElement('div');
        r.style.cssText = 'position:relative;display:flex;justify-content:flex-start';
        const pill = document.createElement('div');
        pill.setAttribute('data-pill', '');
        pill.style.cssText = 'position:relative;display:flex;align-items:center;gap:12px;margin-inline-start:' + start.toFixed(2) + '%;width:' + span.toFixed(2) + '%;min-width:190px;padding:clamp(12px,1.3vw,17px) clamp(20px,2.2vw,30px);border-radius:100px;font-size:clamp(14px,1.15vw,17px);font-weight:600;white-space:nowrap;opacity:0;transform:translateY(14px);transition:opacity .6s ' + EASE + ' ' + (i * 70) + 'ms,transform .6s ' + EASE + ' ' + (i * 70) + 'ms;' +
          (ap ? 'background:#0A1520;color:' + s.bg + ';' : 'background:rgba(10,21,32,.1);color:#0A1520;');
        pill.innerHTML = '<span style="font-family:var(--head);font-weight:700;opacity:.55;font-size:13px">' + AN[i] + '</span><span style="overflow:hidden;text-overflow:ellipsis">' + t + '</span>' +
          (ap ? '<span style="margin-inline-start:auto;width:8px;height:8px;border-radius:50%;background:' + s.bg + ';flex:none"></span>' : '');
        r.appendChild(pill);
        rows.appendChild(r);
      });
      g.appendChild(rows);
    } else {
      const list = document.createElement('div');
      list.style.cssText = 'position:relative;display:flex;flex-direction:column;gap:12px;padding-inline-start:26px';
      const line = document.createElement('div');
      line.style.cssText = 'position:absolute;top:12px;bottom:12px;inset-inline-start:7px;width:1px;background:rgba(10,21,32,.25)';
      list.appendChild(line);
      s.phases.forEach(([t, ap], i) => {
        const row = document.createElement('div');
        row.style.cssText = 'position:relative;display:flex;align-items:center;gap:12px;padding:14px 22px;border-radius:100px;font-size:15px;font-weight:600;opacity:0;transform:translateY(12px);transition:opacity .55s ' + EASE + ' ' + (i * 55) + 'ms,transform .55s ' + EASE + ' ' + (i * 55) + 'ms;' +
          (ap ? 'background:#0A1520;color:' + s.bg + ';' : 'background:rgba(10,21,32,.1);color:#0A1520;');
        row.setAttribute('data-pill', '');
        row.innerHTML = '<span style="position:absolute;inset-inline-start:-23px;width:9px;height:9px;border-radius:50%;background:' + (ap ? '#0A1520' : 'rgba(10,21,32,.35)') + '"></span>' +
          '<span style="font-family:var(--head);font-weight:700;opacity:.55;font-size:13px">' + AN[i] + '</span><span>' + t + '</span>';
        list.appendChild(row);
      });
      g.appendChild(list);
    }
    const lg = q('[data-legend]');
    lg.innerHTML = '<span style="display:inline-flex;align-items:center;gap:9px"><span style="width:11px;height:11px;border-radius:50%;background:#0A1520"></span>مرحلة تحتاج اعتمادك</span>' +
      '<span style="display:inline-flex;align-items:center;gap:9px;opacity:.6"><span style="width:11px;height:11px;border-radius:50%;background:rgba(10,21,32,.28)"></span>مرحلة شغل داخلي</span>' +
      '<span style="opacity:.5">المحور يعبّر عن التسلسل، لا عن الوقت</span>';
    const gio = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; gio.unobserve(e.target); }
    }), { threshold: 0.05 });
    g.querySelectorAll('[data-pill]').forEach(p => gio.observe(p));
    setTimeout(() => g.querySelectorAll('[data-pill]').forEach(p => { p.style.opacity = '1'; p.style.transform = 'none'; }), 3400);

    const pr = q('[data-proof]');
    pr.innerHTML = '';
    s.proof.forEach(k => {
      const o = PROJECTS[k];
      if (!o) return;
      const a = document.createElement('a');
      a.href = 'Melaha Project.dc.html#' + k;
      a.setAttribute('data-magnet', '');
      a.style.cssText = 'display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:rgba(10,21,32,.06);border:1px solid rgba(10,21,32,.1);transition:transform .55s ' + EASE + ',border-color .5s';
      a.innerHTML = '<div style="aspect-ratio:16/10;overflow:hidden;background:rgba(10,21,32,.14)"><img src="' + o.img + '" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;transition:transform 1.1s ' + EASE + '" /></div>' +
        '<div style="padding:clamp(18px,2vw,26px);display:flex;flex-direction:column;gap:8px">' +
        '<div style="font-size:12px;opacity:.55">' + o.c + '</div>' +
        '<div style="font-family:var(--head);font-weight:700;font-size:clamp(18px,1.8vw,26px);line-height:1.25">' + o.t + '</div>' +
        '<div style="margin-top:6px;font-size:14px;font-weight:600">شاهد المشروع ↗</div></div>';
      const im = a.querySelector('img');
      a.addEventListener('mouseenter', () => { a.style.transform = 'translateY(-6px)'; a.style.borderColor = 'rgba(10,21,32,.35)'; if (im) im.style.transform = 'scale(1.06)'; });
      a.addEventListener('mouseleave', () => { a.style.transform = 'none'; a.style.borderColor = 'rgba(10,21,32,.1)'; if (im) im.style.transform = 'none'; });
      pr.appendChild(a);
    });

    this.motion();
  }

  motion() {
    const EASE = 'cubic-bezier(.16,1,.3,1)';
    ['[data-title]', '[data-ctatitle]'].forEach(sel => {
      const h = document.querySelector(sel);
      if (!h) return;
      const words = (h.textContent || '').trim().split(/\s+/);
      h.textContent = '';
      words.forEach((w, i) => {
        const mask = document.createElement('span');
        mask.style.cssText = 'display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em';
        const inner = document.createElement('span');
        inner.textContent = w;
        inner.style.cssText = 'display:inline-block;transform:translateY(108%);transition:transform 1s ' + EASE + ' ' + (i * 70) + 'ms';
        mask.appendChild(inner);
        h.appendChild(mask);
        if (i < words.length - 1) h.appendChild(document.createTextNode(' '));
      });
      const run = () => h.querySelectorAll('span > span').forEach(x => { x.style.transform = 'translateY(0)'; });
      if (sel === '[data-title]') setTimeout(run, 120);
      else {
        const io2 = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { run(); io2.disconnect(); } }), { threshold: 0.2 });
        io2.observe(h);
        setTimeout(run, 3400);
      }
    });

    document.querySelectorAll('[data-reveal]').forEach(el => {
      if (el.dataset.shown) return;
      el.style.opacity = '0';
      el.style.transform = 'translateY(24px)';
      el.style.transition = 'opacity .85s ' + EASE + ',transform .85s ' + EASE;
    });
    const show = el => { el.dataset.shown = '1'; el.style.opacity = '1'; el.style.transform = 'none'; };
    if (this._io) this._io.disconnect();
    this._io = new IntersectionObserver(es => {
      es.forEach(e => { if (e.isIntersecting) { show(e.target); this._io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    document.querySelectorAll('[data-reveal]').forEach(el => this._io.observe(el));
    setTimeout(() => document.querySelectorAll('[data-reveal]').forEach(show), 3200);

    const cur = document.querySelector('[data-cursor]');
    if (!this._cursorIv) {
      let cx = 0, cy = 0, tx = 0, ty = 0;
      this._move = e => { tx = e.clientX; ty = e.clientY; if (cur) cur.style.opacity = '1'; };
      window.addEventListener('mousemove', this._move, { passive: true });
      this._cursorIv = setInterval(() => {
        cx += (tx - cx) * 0.2; cy += (ty - cy) * 0.2;
        if (cur) cur.style.transform = 'translate(' + cx.toFixed(1) + 'px,' + cy.toFixed(1) + 'px) translate(-50%,-50%)';
      }, 16);
    }
    document.querySelectorAll('[data-magnet]').forEach(el => {
      if (el.dataset.mag) return;
      el.dataset.mag = '1';
      el.addEventListener('mouseenter', () => { if (cur) { cur.style.width = '44px'; cur.style.height = '44px'; cur.style.background = 'rgba(10,21,32,.12)'; } });
      el.addEventListener('mouseleave', () => { if (cur) { cur.style.width = '12px'; cur.style.height = '12px'; cur.style.background = 'rgba(10,21,32,.25)'; } });
    });

    if (!this._onScroll) {
      const nav = document.querySelector('[data-nav]');
      const bar = document.querySelector('[data-progress]');
      let lastY = window.scrollY;
      this._onScroll = () => {
        const y = window.scrollY;
        const max = document.documentElement.scrollHeight - window.innerHeight;
        if (bar) bar.style.width = (max > 0 ? (y / max) * 100 : 0) + '%';
        if (nav) {
          if (y > lastY + 4 && y > 220) nav.style.transform = 'translateY(-110%)';
          if (y < lastY - 4) nav.style.transform = 'translateY(0)';
          nav.style.padding = y > 80 ? '14px clamp(20px,4vw,56px)' : '22px clamp(20px,4vw,56px)';
          if (Math.abs(y - lastY) > 4) lastY = y;
        }
      };
      window.addEventListener('scroll', this._onScroll, { passive: true });
      window.addEventListener('resize', this._onScroll);
      this._onScroll();
    }
  }

  componentWillUnmount() {
    clearInterval(this._cursorIv);
    if (this._io) this._io.disconnect();
    window.removeEventListener('hashchange', this._hash);
    window.removeEventListener('resize', this._rz);
    window.removeEventListener('scroll', this._onScroll);
    window.removeEventListener('resize', this._onScroll);
    window.removeEventListener('mousemove', this._move);
  }

  renderVals() { return {}; }
}

</script>
</body>
</html>
